services:
  db:
    container_name: companybrain-db
    image: postgres:16
    restart: always
    environment:
      POSTGRES_USER: company_brain
      POSTGRES_PASSWORD: company_brain
      POSTGRES_DB: company_brain
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U company_brain -d company_brain"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    container_name: companybrain-backend
    build: ./backend
    image: companybrain-backend:latest
    restart: always
    environment:
      DATABASE_URL: postgresql://company_brain:company_brain@db:5432/company_brain
      PORT: 8000
      FRONTEND_ORIGIN: "*"
      AUTO_SEED: "true"
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

volumes:
  pgdata:
